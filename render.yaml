services:
  - type: static
    name: astraroam
    buildCommand: npm install && npx vite build
    staticPublishPath: dist
    envVars:
      - name: VITE_API_URL
        value: https://astraroam-api.onrender.com
    routes:
      - type: rewrite
        source: /**
        destination: /index.html

  - type: web
    name: astraroam-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: astraroam
      - key: JWT_SECRET
        sync: false
